{% extends "base.html" %}

{% block title %}Atlas — Delete {{ product.name }}{% endblock %}

{% block content %}
    <h2>Delete "{{ product.name }}"?</h2>
    <p class="text-danger">This can't be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
            <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
