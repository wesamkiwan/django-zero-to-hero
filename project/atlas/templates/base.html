{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atlas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

    <header class="site-header">
        <div class="container header-row">
            <a href="{% url 'pages:home' %}" class="logo">Atlas<span>.</span></a>
            <nav>
                <a href="{% url 'pages:home' %}"{% if request.resolver_match.url_name == 'home' %} class="active"{% endif %}>Home</a>
                <a href="{% url 'pages:products' %}"{% if request.resolver_match.url_name == 'products' %} class="active"{% endif %}>Products</a>
                <a href="{% url 'pages:about' %}"{% if request.resolver_match.url_name == 'about' %} class="active"{% endif %}>About</a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Atlas Store &mdash; built while learning Django.</p>
        </div>
    </footer>

</body>
</html>
