upstream atlas {
    server web:8000;
}

server {
    listen 80;

    # Served directly by Nginx — never round-tripped through Gunicorn/
    # Django at all, which is the whole performance point of this
    # architecture: a request for a CSS file shouldn't wake up a Python
    # worker process.
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://atlas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
