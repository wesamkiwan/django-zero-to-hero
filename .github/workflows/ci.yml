name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, not SQLite — this is exactly what production
    # (Module 16's docker-compose.yml) actually runs, and SQLite is
    # lenient about a few things Postgres isn't (case sensitivity,
    # certain constraint checks) — passing against SQLite alone wouldn't
    # actually prove the app works against the database it's deployed on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      POSTGRES_DB: atlas_ci
      POSTGRES_USER: atlas_ci
      POSTGRES_PASSWORD: atlas_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/atlas/requirements-dev.txt

      - name: Install dependencies
        working-directory: project/atlas
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        working-directory: project/atlas
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: project/atlas
        run: coverage run -m pytest -v

      - name: Coverage report
        working-directory: project/atlas
        run: coverage report

      - name: Django deployment checks (informational)
        working-directory: project/atlas
        # Doesn't fail the build — this course's own DEBUG/ALLOWED_HOSTS
        # defaults are dev-friendly, not deploy-ready, on purpose (see
        # Module 15). This just keeps the warnings visible in CI output.
        run: python manage.py check --deploy || true

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build the image (build only — no registry push)
        working-directory: project/atlas
        run: docker build -t atlas:ci .
